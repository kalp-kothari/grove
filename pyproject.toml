[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grove-vcs"
version = "0.1.0"
description = "Semantic Version Control for Config Files"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "toml>=0.10.0",
]

[project.scripts]
grove = "grove.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
